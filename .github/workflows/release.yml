name: Release new Drakvuf Sandbox version

on:
  release:
    types: [published]

jobs:
  release_artifacts:
    # Version releases only (tags v*); media releases such as the demo video carry no packages.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          workflow_conclusion: success
      - uses: nanoufo/action-upload-artifacts-and-release-assets@v2
        with:
          path: |
            drakvuf-sandbox-whl/drakvuf_sandbox-*.whl
          upload-release-files: true
          release-upload-url: ${{ github.event.release.upload_url }}
      # No PyPI upload: the drakvuf-sandbox package name on PyPI belongs to upstream CERT Polska.
