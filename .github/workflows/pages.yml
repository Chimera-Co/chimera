name: Documentation site (GitHub Pages)

# The console's Home and Docs pages, built as a static site (drakrun/web/frontend, `npm run build:site`).
on:
  push:
    branches: [master]
    paths:
      - "drakrun/web/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drakrun/web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drakrun/web/frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run src/home src/docs
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: drakrun/web/frontend/dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
